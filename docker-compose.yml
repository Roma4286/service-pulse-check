name: "service_pulse_check"

services:
  db:
    image: postgres:17.0
    restart: no
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-service_pulse_check}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: pg_isready -U $${POSTGRES_USER}
      interval: 5s

  redis:
    image: redis:8.2.1
    restart: no
    container_name: 'redis'
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'

  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
    ports:
      - '5000:5000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A app.celery.tasks worker --loglevel=info
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
    depends_on:
      - web

  beat:
    build: .
    command: celery -A app.celery.tasks beat --loglevel=info
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
    depends_on:
      - web

volumes:
  pgdata:
  redis_data:
