<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrate</title>
    <link rel="stylesheet" href="{{ url_for('web.static', filename='style.css') }}">
</head>
<body>
    <div class="auth-container">
        <h1>Registrate</h1>
        {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
        <form class="auth-form" method="post" action="{{ url_for('web.auth.register') }}">
            <div class="input-group">
                <label for="reg-username">Username</label>
                <input type="text" id="reg-username" name="username" value="{{ username or '' }}" placeholder="USERNAME" required>
            </div>
            <div class="input-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" name="password" placeholder="PASSWORD" required>
            </div>
            <div class="input-group">
                <label for="reg-confirm">Repite password</label>
                <input type="password" id="reg-confirm" name="confirm_password" placeholder="REPEAT PASSWORD" required>
            </div>
            <button type="submit">Create account</button>
        </form>
        <p class="bottom-text">Already have an account? <a href="{{ url_for('web.auth.login') }}">Login to</a></p>
    </div>
</body>
</html>
