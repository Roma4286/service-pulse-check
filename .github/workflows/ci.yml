name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements.txt)"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip


      - name: Create .env
        run: cp .env.example .env

      - name: Download requirements
        run: pip install -r requirements.txt 
    
      - name: Run tests
        run: pytest --cov=. --cov-report=json

      - name: Update Badge in README
        run: |
          PCT=$(python -c "import json; f = open('coverage.json'); d = json.load(f); print(round(d['totals']['percent_covered']))")
          
          if [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 75 ]; then COLOR="green"
          elif [ "$PCT" -ge 50 ]; then COLOR="yellow"
          else COLOR="red"; fi

          sed -i -E "s|coverage-[0-9]+%25-[a-z]+|coverage-${PCT}%25-${COLOR}|g" README.md

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage badge to matches CI [skip ci]"
          file_pattern: 'README.md'